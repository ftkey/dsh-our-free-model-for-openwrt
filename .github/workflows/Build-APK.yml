name: Build APK
run-name: 编译 dsh-our-free-model-for-openwrt APK

on:
  schedule:
    # UTC 00:17：每 24 小时检查一次，北京时间约每天 08:17。
    - cron: '17 0 * * *'
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: 同步 Ebony-Vinyl/dsh-our-free-model 最新默认分支后编译（仅 main）
        type: boolean
        default: true
      publish:
        description: 编译成功后发布到 GitHub Releases
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 检查并同步上游
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      should_build: ${{ steps.source.outputs.should_build }}
    steps:
      - name: 检出移植仓库
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref || github.sha }}
          fetch-depth: 0

      - name: 判断是否同步上游
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          SYNC_REQUESTED: ${{ inputs.sync_upstream }}
        run: |
          enabled=false
          if [[ "$GITHUB_REF" == refs/heads/main && "$EVENT_NAME" != pull_request ]]; then
            if [[ "$EVENT_NAME" != workflow_dispatch || "$SYNC_REQUESTED" == true ]]; then
              enabled=true
            fi
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: 检出固定上游的最新默认分支
        if: steps.mode.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: Ebony-Vinyl/dsh-our-free-model
          path: .upstream
          persist-credentials: false

      - name: 安装同步工具
        if: steps.mode.outputs.enabled == 'true'
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install --no-install-recommends rsync

      - name: 配置 Node.js
        if: steps.mode.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 刷新运行时并递增包版本
        if: steps.mode.outputs.enabled == 'true'
        id: sync
        run: bash scripts/sync-upstream.sh "$GITHUB_WORKSPACE/.upstream"

      - name: 提交同步结果
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- payload Makefile LICENSE
          git commit -m 'chore: 自动同步上游运行时'
          # 不强制推送；main 被并发更新时终止，避免覆盖用户提交。
          git push origin HEAD:main

      - name: 确定编译提交
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_CHANGED: ${{ steps.sync.outputs.changed }}
        run: |
          source_sha="$(git rev-parse HEAD)"
          should_build=true
          if [[ "$EVENT_NAME" == schedule && "$UPSTREAM_CHANGED" != true ]]; then
            # 已有成功构建则跳过；失败、取消或没有构建记录时继续重试。
            completed_runs="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/Build-APK.yml/runs" \
              -f branch=main -f head_sha="$source_sha" -f status=completed -f per_page=100)"
            if jq -e '.workflow_runs | any(.conclusion == "success")' <<< "$completed_runs" >/dev/null; then
              should_build=false
            fi
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "编译提交：$source_sha；需要编译：$should_build" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: APK / ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arm64-ipq60xx
            target: qualcommax
            subtarget: ipq60xx
            sdk_prefix: immortalwrt-sdk-qualcommax-ipq60xx_
          - platform: amd64
            target: x86
            subtarget: '64'
            sdk_prefix: immortalwrt-sdk-x86-64_
    env:
      SDK_BASE_URL: https://downloads.immortalwrt.org/snapshots/targets/${{ matrix.target }}/${{ matrix.subtarget }}
      SDK_ARCHIVE_PREFIX: ${{ matrix.sdk_prefix }}
    steps:
      - name: 检出本次确定的源码
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: 安装构建依赖
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install --no-install-recommends \
            build-essential clang flex bison g++ gawk gettext git \
            libelf-dev libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig time unzip wget xsltproc zip zlib1g-dev zstd

      - name: 确定 SDK 版本和校验值
        id: sdk
        run: |
          curl -fsSL --retry 3 "$SDK_BASE_URL/sha256sums" -o "$RUNNER_TEMP/sdk-sha256sums"
          archive=''
          while read -r sum name; do
            name="${name#\*}"
            if [[ "$name" == "$SDK_ARCHIVE_PREFIX"*'.Linux-x86_64.tar.zst' ]]; then
              archive="$name"
              echo "archive=$name" >> "$GITHUB_OUTPUT"
              echo "sha256=$sum" >> "$GITHUB_OUTPUT"
              break
            fi
          done < "$RUNNER_TEMP/sdk-sha256sums"
          [[ -n "$archive" ]]

      - name: 缓存 SDK 归档
        uses: actions/cache@v4
        with:
          path: ~/.cache/ofm-sdk/${{ matrix.platform }}
          key: ofm-sdk-${{ matrix.platform }}-${{ steps.sdk.outputs.sha256 }}

      - name: 下载并验证 SDK
        env:
          SDK_ARCHIVE: ${{ steps.sdk.outputs.archive }}
          SDK_SHA256: ${{ steps.sdk.outputs.sha256 }}
        run: |
          cache_dir="$HOME/.cache/ofm-sdk/${{ matrix.platform }}"
          archive_path="$cache_dir/$SDK_ARCHIVE"
          mkdir -p "$cache_dir"
          if [[ ! -f "$archive_path" ]] || \
             [[ "$(sha256sum "$archive_path" | cut -d' ' -f1)" != "$SDK_SHA256" ]]; then
            curl -fL --retry 3 "$SDK_BASE_URL/$SDK_ARCHIVE" -o "$archive_path"
          fi
          echo "$SDK_SHA256  $archive_path" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/sdk"
          tar --zstd -xf "$archive_path" -C "$RUNNER_TEMP/sdk"
          sdk_root="$(find "$RUNNER_TEMP/sdk" -mindepth 1 -maxdepth 1 -type d -name 'immortalwrt-sdk-*' -print -quit)"
          [[ -n "$sdk_root" ]]
          echo "SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          cp "$RUNNER_TEMP/sdk-sha256sums" "$RUNNER_TEMP/SDK-SHA256SUMS"

      - name: 准备软件包依赖
        run: |
          cd "$SDK_ROOT"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 编译并校验 APK
        env:
          SDK_TARGET: ${{ matrix.target }}
          SDK_SUBTARGET: ${{ matrix.subtarget }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          bash scripts/build-apk.sh "$SDK_ROOT" "$RUNNER_TEMP/apk-output" "$SDK_TARGET" "$SDK_SUBTARGET"
          cp "$RUNNER_TEMP/SDK-SHA256SUMS" "$RUNNER_TEMP/apk-output/"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/apk-output/SOURCE-SHA"
          echo '### APK 编译结果' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/apk-output/SHA256SUMS" >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 APK 和构建信息
        uses: actions/upload-artifact@v4
        with:
          name: dsh-our-free-model-for-openwrt-${{ matrix.platform }}
          path: ${{ runner.temp }}/apk-output/
          if-no-files-found: error
          retention-days: 30

      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.platform }}
          path: ${{ env.SDK_ROOT }}/logs/
          if-no-files-found: ignore

  publish:
    name: 发布 APK
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 下载全部编译产物
        uses: actions/download-artifact@v4
        with:
          pattern: dsh-our-free-model-for-openwrt-*
          path: output

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          tag="apk-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          assets=()
          for dir in output/*; do
            platform="${dir##*/}"
            (cd "$dir" && zip -q "$GITHUB_WORKSPACE/$platform.zip" ./*)
            assets+=("$GITHUB_WORKSPACE/$platform.zip")
          done
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          dsh-our-free-model-for-openwrt APK（ImmortalWrt snapshot SDK）

          arm64-ipq60xx：太乙 ER1 / qualcommax-ipq60xx；amd64：x86/64。
          每个 ZIP 含 APK、SHA256SUMS、SDK 配置、SDK 校验列表及源提交信息。
          需要固件源提供 Node.js 22.19+ 或 24+；第三方 APK 安装时使用 --allow-untrusted。
          snapshot SDK 与自定义 ROM 的依赖版本可能不同，请以设备上的依赖检查为准。

          源提交：$SOURCE_SHA
          NOTES
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" --title "dsh-our-free-model-for-openwrt $tag" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
